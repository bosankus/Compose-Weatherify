name: iosApp
options:
  bundleIdPrefix: bose.ankush.weatherify
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # KMP dropped iosX64 (x86_64 simulator) once Compose Multiplatform stopped
    # publishing artifacts for it; without this, Xcode still builds x86_64 for
    # the simulator SDK by default and syncComposeResourcesForIos rejects it.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    # The Kotlin build phase below writes into the project directory, which Xcode 16+
    # forbids by default. CocoaPods used to turn this off through the pod xcconfig;
    # without pods it has to be set here or the build fails in
    # :app:iosApp:checkSandboxAndWriteProtection.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  # Generated by `./gradlew :app:iosApp:integrateLinkagePackage` (see build.gradle.kts'
  # swiftPMDependencies). It re-exports every Swift package the shared KMP modules
  # cinterop against — Razorpay here, Firebase from :analytics and :feature:home — so the
  # app link step resolves their symbols. This replaces what the Podfile used to do.
  KotlinMultiplatformLinkedPackage:
    path: KotlinMultiplatformLinkedPackage

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    dependencies:
      - package: KotlinMultiplatformLinkedPackage
        product: KotlinMultiplatformLinkedPackage
    info:
      path: iosApp/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        NSLocationWhenInUseUsageDescription: "Weatherify needs your location to show local weather conditions."
        # Without this, xcodegen regenerates Info.plist from just this properties
        # map on every `xcodegen generate` and silently drops UILaunchScreen,
        # which causes iOS to fall back to legacy (non-full-screen) launch scaling.
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bose.ankush.weatherify.ios
        PRODUCT_NAME: iosApp
        # embedAndSignAppleFrameworkForXcode (Run Script below) drops the built
        # .framework into $TARGET_BUILD_DIR, which Xcode already searches — this
        # flag is what actually links the static framework into the binary.
        OTHER_LDFLAGS: $(inherited) -framework ComposeApp
        ENABLE_BITCODE: NO
    preBuildScripts:
      - name: Compile Kotlin Framework (KMP :app:iosApp)
        shell: /bin/sh
        script: |
          unset ANDROID_PREFS_ROOT
          cd "$SRCROOT/../.."
          ./gradlew :app:iosApp:embedAndSignAppleFrameworkForXcode
        # No inputFiles/outputFiles: this framework is linked from every shared
        # KMP module (:common-ui, :feature:*, :network, :storage, ...), not just
        # app/iosApp/src/iosMain. Declaring a narrow input glob here made Xcode
        # skip this whole script (and silently reuse a stale ComposeApp.framework)
        # whenever a change landed outside that glob. Gradle's own task-level
        # up-to-date checks already make a no-op invocation fast, so it's safe to
        # always run this phase and let Gradle decide what's stale.
