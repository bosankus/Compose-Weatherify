name: CI

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Symlink android-37 platform dir for AGP
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          PLATFORM_DIR="$SDK_ROOT/platforms"
          if [ -d "$PLATFORM_DIR/android-37.0" ] && [ ! -e "$PLATFORM_DIR/android-37" ]; then
            ln -s android-37.0 "$PLATFORM_DIR/android-37"
          fi
          ls -la "$PLATFORM_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/androidApp/google-services.json

      - name: Build
        run: ./gradlew --no-daemon --parallel --configuration-cache build

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && hashFiles('**/build/test-results/**/*.xml') != ''
        with:
          files: '**/build/test-results/**/*.xml'

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Symlink android-37 platform dir for AGP
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          PLATFORM_DIR="$SDK_ROOT/platforms"
          if [ -d "$PLATFORM_DIR/android-37.0" ] && [ ! -e "$PLATFORM_DIR/android-37" ]; then
            ln -s android-37.0 "$PLATFORM_DIR/android-37"
          fi
          ls -la "$PLATFORM_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/androidApp/google-services.json

      - name: Apply code formatting
        run: ./gradlew --no-daemon --parallel codeFormat

      - name: Commit formatting fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: apply automatic code formatting"
          file_pattern: "**/*.kt **/*.kts"

      - name: Code check (spotless + detekt)
        env:
          RAZORPAY_KEY: ${{ secrets.RAZORPAY_KEY }}
        run: ./gradlew --no-daemon --parallel codeCheck
