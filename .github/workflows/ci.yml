name: CI

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Symlink android-37 platform dir for AGP
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          PLATFORM_DIR="$SDK_ROOT/platforms"
          if [ -d "$PLATFORM_DIR/android-37.0" ] && [ ! -e "$PLATFORM_DIR/android-37" ]; then
            ln -s android-37.0 "$PLATFORM_DIR/android-37"
          fi
          ls -la "$PLATFORM_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/androidApp/google-services.json

      - name: Build
        run: ./gradlew --no-daemon --parallel --configuration-cache build

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && hashFiles('**/build/test-results/**/*.xml') != ''
        with:
          files: '**/build/test-results/**/*.xml'

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Symlink android-37 platform dir for AGP
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          PLATFORM_DIR="$SDK_ROOT/platforms"
          if [ -d "$PLATFORM_DIR/android-37.0" ] && [ ! -e "$PLATFORM_DIR/android-37" ]; then
            ln -s android-37.0 "$PLATFORM_DIR/android-37"
          fi
          ls -la "$PLATFORM_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/androidApp/google-services.json

      - name: Apply code formatting
        run: ./gradlew --no-daemon --parallel codeFormat

      - name: Commit formatting fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: apply automatic code formatting"
          file_pattern: "**/*.kt **/*.kts"

      - name: Verify GCP Secret Manager variables
        run: |
          missing=()
          [[ -z "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]] && missing+=("GCP_WORKLOAD_IDENTITY_PROVIDER")
          [[ -z "${{ vars.GCP_SERVICE_ACCOUNT }}" ]] && missing+=("GCP_SERVICE_ACCOUNT")
          [[ -z "${{ vars.GCP_PROJECT_ID }}" ]] && missing+=("GCP_PROJECT_ID")
          [[ -z "${{ vars.GCP_SECRET_RAZORPAY }}" ]] && missing+=("GCP_SECRET_RAZORPAY")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required repository Actions variables: ${missing[*]}"
            echo "Ankush must configure manually (do not put secret values in git):"
            echo "  1. GCP Secret Manager secret with the Razorpay API key"
            echo "     (suggested secret id: weatherify-razorpay-key)"
            echo "  2. Workload Identity Federation + service account for GitHub OIDC"
            echo "  3. Repo Actions variables:"
            echo "       GCP_WORKLOAD_IDENTITY_PROVIDER"
            echo "       GCP_SERVICE_ACCOUNT"
            echo "       GCP_PROJECT_ID"
            echo "       GCP_SECRET_RAZORPAY  (secret id, e.g. weatherify-razorpay-key)"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Fetch Razorpay API key from GCP Secret Manager
        id: fetch-razorpay
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            RAZORPAY_KEY:${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_SECRET_RAZORPAY }}

      - name: Code check (spotless + detekt)
        env:
          RAZORPAY_KEY: ${{ steps.fetch-razorpay.outputs.RAZORPAY_KEY }}
        run: ./gradlew --no-daemon --parallel codeCheck
