[versions]
# SDK
compileSdk = "37"
minSdk = "28"
targetSdk = "37"

# Kotlin / Compose
kotlin = "2.4.10"
composeBom = "2026.06.01"
composeMultiplatform = "1.12.0-beta03"
cmp-runtime = "1.12.0-beta03"
cmp-foundation = "1.12.0-beta03"
cmp-animation = "1.12.0-beta03"
cmp-material3 = "1.9.0"
cmp-ui = "1.12.0-beta03"
cmp-materialIconsExtended = "1.7.3"

# Gradle plugins
agp = "9.3.1"
secretsPlugin = "2.0.1"
benManesVersions = "0.58.0"
spotless = "8.9.0"
ksp = "2.3.9"
ktlintGradle = "14.2.0"
ktlintCli = "1.7.1"
detekt = "1.23.8"
googleServices = "4.5.0"

# Testing
junit = "4.13.2"
truth = "1.4.5"
mockk = "1.14.11"

# AndroidX core
androidxCore = "1.19.0"
appCompat = "1.7.1"
androidMaterial = "1.14.0"
lifecycle = "2.11.0"
googlePlayCore = "2.1.0"
googlePlayLocation = "21.4.0"
googlePlayServicesWearable = "20.0.1"
dataStore = "1.2.1"
splashScreen = "1.2.0"
securityCrypto = "1.1.0"
activityCompose = "1.13.0"

# Room
room = "2.8.4"

# Networking
gson = "2.14.0"

# Firebase
firebaseBom = "34.17.0"

# Coroutines (also covers kotlinx-coroutines-test)
coroutines = "1.11.0"

# Kotlinx Date/Time (KMP-compatible, replaces java.time) — single version shared by all modules
kotlinxDatetime = "0.8.0-0.6.x-compat"

# Dependency Injection
hilt = "2.60.1"
hiltCompose = "1.4.0"

# Navigation 3
nav3 = "1.1.5"
lifecycleViewmodelNav3 = "2.11.0"

# Miscellaneous
timber = "5.0.1"
coilKmp = "3.5.0"

# Memory leak
leakCanary = "2.14"

# Wear OS
wearComposeMaterial3 = "1.6.2"
wearComposeFoundation = "1.6.2"
wearComposeNavigation3 = "1.6.2"
wearToolingPreview = "1.0.0"
lottieCompose = "6.7.1"

# Payment module
razorpayCheckout = "1.6.41"
razorpayStandardCore = "1.7.17"

# KMP — Ktor
ktor = "3.5.2"

# KMP — Serialization
kotlinxSerialization = "1.11.0"

# KMP — Koin
koin = "4.2.2"

# KMP — ViewModel (JetBrains port of AndroidX lifecycle-viewmodel)
kmpLifecycleViewModel = "2.11.0"

# KMP — Okio (file paths for multiplatform DataStore)
okio = "3.18.1"

[libraries]
# buildSrc convention-plugin dependencies (applied by Gradle-plugin-id, not version catalog alias,
# since they're consumed from buildSrc's own build.gradle.kts rather than a project's plugins {} block)
spotless-plugin-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

# AndroidX core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appCompat" }
google-material = { module = "com.google.android.material:material", version.ref = "androidMaterial" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
google-play-app-update = { module = "com.google.android.play:app-update", version.ref = "googlePlayCore" }
google-play-app-update-ktx = { module = "com.google.android.play:app-update-ktx", version.ref = "googlePlayCore" }
google-play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "googlePlayLocation" }
google-play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "googlePlayServicesWearable" }
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "dataStore" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashScreen" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# Compose (versions resolved via androidx-compose-bom)
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

# Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# Networking
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# Firebase (versions resolved via firebase-bom)
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-config = { module = "com.google.firebase:firebase-config" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-perf = { module = "com.google.firebase:firebase-perf" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }

# Coroutines / Date-time
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Dependency Injection
google-dagger-hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
google-dagger-hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "hiltCompose" }

# Navigation 3
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }

# Miscellaneous
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
leakcanary-android = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakCanary" }

# Wear OS
androidx-wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wearComposeMaterial3" }
androidx-wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearComposeFoundation" }
androidx-wear-compose-navigation3 = { module = "androidx.wear.compose:compose-navigation3", version.ref = "wearComposeNavigation3" }
androidx-wear-tooling-preview = { module = "androidx.wear:wear-tooling-preview", version.ref = "wearToolingPreview" }
lottie-compose = { module = "com.airbnb.android:lottie-compose", version.ref = "lottieCompose" }

# KMP — Coil 3 (feature:home only, distinct from the app-wide Coil 2 usage above)
coil3-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coilKmp" }
coil3-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coilKmp" }

# KMP — Okio
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }

# Payment (Android-only — Razorpay checkout is launched from the app layer)
razorpay-checkout = { module = "com.razorpay:checkout", version.ref = "razorpayCheckout" }
razorpay-standard-core = { module = "com.razorpay:standard-core", version.ref = "razorpayStandardCore" }

# KMP — Ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-serialization = { module = "io.ktor:ktor-client-serialization", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }

# KMP — Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-core-viewmodel = { module = "io.insert-koin:koin-core-viewmodel", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

# KMP — ViewModel
androidx-lifecycle-viewmodel-kmp = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "kmpLifecycleViewModel" }

# Compose Multiplatform
compose-multiplatform-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "cmp-runtime" }
compose-multiplatform-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "cmp-foundation" }
compose-multiplatform-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "cmp-animation" }
compose-multiplatform-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "cmp-material3" }
compose-multiplatform-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "cmp-ui" }
compose-multiplatform-materialIconsExtended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "cmp-materialIconsExtended" }
compose-multiplatform-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "cmp-foundation" }
compose-multiplatform-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "cmp-ui" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
secrets-gradle-plugin = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secretsPlugin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ben-manes-versions = { id = "io.github.ben-manes.versions", version.ref = "benManesVersions" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
